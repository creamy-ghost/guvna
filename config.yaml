# Guvna config — config-as-code, in git. Keys live in env only (.env.providers),
# referenced here by name. See docs/ARCHITECTURE.md.
port: 20128

providers:
  # --- Bazaarlink: OpenRouter-style free models ---
  - name: bazaarlink
    type: openai
    base_url: https://bazaarlink.ai/api
    key_envs:
      - BAZAARLINK_1_KEY
      - BAZAARLINK_2_KEY
    models:
      - qwen/qwen3.7-flash:free
      - deepseek/deepseek-v4-flash:free
  # --- Groq: fast, generous free tier ---
  - name: groq
    type: openai
    base_url: https://api.groq.com/openai
    key_envs:
      - GROQ_1_KEY
      - GROQ_2_KEY
      - GROQ_3_KEY
    models:
      - llama-3.3-70b-versatile
      - gpt-oss-120b
      - openai/gpt-oss-20b
      - openai/gpt-oss-120b
      - qwen/qwen3.6-27b
      - groq/compound
      - llama-3.1-8b-instant
  # --- Mistral: coder models ---
  - name: mistral
    type: openai
    base_url: https://api.mistral.ai
    key_envs:
      - MISTRAL_1_KEY
    models:
      - codestral-latest
      - devstral-latest
      - mistral-small-latest
      - mistral-large-latest
      - mistral-medium-3-5
      - mistral-small-2603
      - ministral-3b-2512
      - ministral-8b-2512
  # --- Gemini (Google AI Studio) via its OpenAI-compatible endpoint ---
  - name: gemini
    type: gemini
    base_url: https://generativelanguage.googleapis.com
    key_envs:
      - GEMINI_1_KEY
      - GEMINI_2_KEY
      - GEMINI_3_KEY
    models:
      - gemini-2.5-flash
      - gemini-3-flash-preview
      - gemma-4-31b-it
      - gemma-4-26b-a4b-it
  # --- Orcarouter: aggregator with big-context free tiers (adaptor appends /v1).
  # Prefixes let clients call any catalog model directly as <prefix>/<model>,
  # e.g. orcarouter/free, openai/gpt-5.6-luna. ---
  - name: orcarouter
    type: openai
    base_url: https://api.orcarouter.ai
    key_envs:
      - ORCA_1_KEY
      - ORCA_2_KEY
      - ORCA_3_KEY
    prefixes:
      - orcarouter
      - openai
      - anthropic
      - google
    models:
      - orcarouter/free
      - deepseek/deepseek-v4-flash-free
      - qwen/qwen3.8-27b-free

# No default chains. Every chain is created per use case by the client
# (POST /v1/chains, persisted to <data-dir>/chains.yaml). Clients may also
# call provider-prefixed model names directly, e.g. "groq/llama-3.3-70b-versatile".