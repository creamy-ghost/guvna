# Guvna. Secrets come from .env (see .env.example).
# host network: use this when your Docker cannot create bridge networks (no iptables),
# and a host-network reverse proxy reaches the app on 127.0.0.1:20128.
services:
  guvna:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: guvna:latest
    container_name: guvna
    restart: unless-stopped
    mem_limit: 400m
    network_mode: host
    environment:
      - GOMEMLIMIT=256MiB
    env_file: .env
    volumes:
      - guvna-data:/data
    healthcheck:
      test: ["CMD", "/guvna", "-healthcheck", "-config", "/config.yaml"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Optional web UI. Only starts with an explicit profile so the default
  # deploy stays gateway-only (zero RAM when off):
  #   docker compose -f deploy/docker-compose.yml --profile dashboard up -d
  # Never exposed directly — put a reverse proxy with access control
  # (basic_auth / IP allowlist) in front. See docs/DASHBOARD.md.
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
    image: guvna-dashboard:latest
    container_name: guvna-dashboard
    restart: unless-stopped
    mem_limit: 128m
    network_mode: host
    profiles:
      - dashboard
    environment:
      - GOMEMLIMIT=64MiB
      - GUVNA_URL=http://127.0.0.1:20128
    env_file:
      - .env
      - path: dashboard.env
        required: false
    depends_on:
      guvna:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/guvna-dashboard", "-healthcheck", "-addr", "127.0.0.1:20129"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  guvna-data: