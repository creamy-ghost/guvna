{{define "layout"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guvna dashboard</title>
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/custom.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<main class="container">
<header>
<h1>Guvna</h1>
<p class="muted">gateway dashboard &middot; {{.Gateway}}</p>
</header>
<nav>
<button hx-get="/partial/overview" hx-target="#panel" hx-swap="innerHTML">Overview</button>
<button hx-get="/partial/chains" hx-target="#panel" hx-swap="innerHTML">Chains</button>
<button hx-get="/partial/keys" hx-target="#panel" hx-swap="innerHTML">Keys</button>
<button hx-get="/partial/logs" hx-target="#panel" hx-swap="innerHTML">Logs</button>
</nav>
<div id="panel" hx-get="/partial/overview" hx-trigger="load" hx-swap="innerHTML" aria-live="polite">
<p class="muted">Loading&hellip;</p>
</div>
</main>
</body>
</html>{{end}}
